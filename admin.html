<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Sorteos — Administración</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1c2130;--muted:#747b8d;--line:#e8ebf2;--p:#635bff;--ps:#efedff;--ok:#20a66a;--warn:#db971a;--danger:#e45463;--shadow:0 10px 30px rgba(34,42,70,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1250px;margin:auto;padding:18px}.top{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--shadow);position:sticky;top:10px;z-index:20}.brand{font-size:18px;font-weight:900}.brand b{color:var(--p)}.sub{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:800;font-size:12px}.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}.ey{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--p);font-weight:900}.metric{font-size:28px;font-weight:900;margin-top:5px}.h{font-size:20px;font-weight:900;margin:4px 0 12px}.muted{color:var(--muted)}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;font-size:12px}.primary{background:var(--p);color:#fff}.light{background:#f2f4f8;color:var(--text)}.danger{background:#fff0f2;color:var(--danger)}.ok{background:#e8f8f0;color:var(--ok)}.warn{background:#fff6de;color:#8b6515}.field{margin:9px 0}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.field textarea{min-height:90px;resize:vertical}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{font-size:10px;color:var(--muted);text-transform:uppercase}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#f1f3f7;font-size:10px;font-weight:800}.pill.ok{background:#e8f8f0;color:var(--ok)}.pill.warn{background:#fff6de;color:#8b6515}.pill.danger{background:#fff0f2;color:var(--danger)}.pill.info{background:var(--ps);color:var(--p)}.numbers{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.num{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:900}.num.reserved{background:#fff6de;color:#8b6515}.num.sold{background:#fff0f2;color:var(--danger)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%)}.hidden{display:none!important}.notice{padding:11px;border-radius:12px;background:#ebf4ff;color:#316aa8;font-size:12px;margin-bottom:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.right{text-align:right}.search{max-width:320px}@media(max-width:800px){
  html,body{width:100%;overflow-x:hidden}
  .wrap{max-width:none;width:100%;padding:12px}
  .top{top:6px;padding:13px;border-radius:16px;align-items:center}
  .brand{font-size:17px}.sub{font-size:10px}
  .tabs{margin:10px -2px 12px;padding:2px;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;min-height:42px;padding:10px 12px;font-size:11px}
  .grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}
  .card{padding:14px;border-radius:16px}
  .h{font-size:18px}
  .metric{font-size:25px}
  .numbers{grid-template-columns:repeat(5,1fr);gap:6px}
  .num{min-width:0;border-radius:9px}
  .actions{width:100%;gap:6px}
  .actions .btn{flex:1 1 auto;min-height:42px}
  .btn{min-height:42px;padding:10px 12px}
  .field input,.field textarea,.field select{min-height:44px;font-size:16px}
  .field textarea{min-height:110px}
  .table{display:block;width:100%;overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch;border-spacing:0}
  .table th,.table td{padding:10px 8px}
  .table th:first-child,.table td:first-child{padding-left:2px}
  .notice{font-size:11px}
  .login{padding:14px}.loginbox{width:100%;max-width:430px}
}
@media(max-width:520px){
  .wrap{padding:8px}
  .top{position:sticky;top:5px;padding:11px 12px}
  .top .btn{min-height:40px;padding:9px 11px}
  .brand{font-size:16px}.sub{max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabs{margin:8px 0 12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;overflow:visible;padding:0}
  .tabs button{min-height:42px;padding:8px 7px;font-size:10px;white-space:normal;line-height:1.15}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .grid2{gap:8px}
  .card{padding:12px;border-radius:14px;margin-bottom:8px;box-shadow:0 6px 18px rgba(34,42,70,.05)}
  .ey{font-size:9px}.h{font-size:17px;margin-bottom:10px}.metric{font-size:23px}
  .top{box-shadow:0 6px 18px rgba(34,42,70,.05)}
  .top + .tabs{position:relative;z-index:1}
  .table{font-size:11px}
  .table th{font-size:9px}
  .numbers{grid-template-columns:repeat(5,1fr);gap:5px}
  .num{font-size:12px}
  .actions{flex-direction:column}.actions .btn{width:100%;flex:1 1 100%}
  .right{text-align:left}
}
@media(max-width:360px){
  .grid{grid-template-columns:1fr}
  .top{gap:7px}.brand{font-size:15px}.sub{max-width:145px}
  .numbers{gap:4px}.num{font-size:11px}
}
</style>
</head>
<body><div id="app"></div>
<script>
const SUPABASE_URL='https://ausbporsojexixlwenzv.supabase.co';
const SUPABASE_KEY='sb_publishable_IUyBSwpVsu_gd3VpwiDmEw_0VRqXukM';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById('app');
let tab='dashboard', D={raffles:[],numbers:[],purchases:[],profiles:[],results:[],referrals:[],ledger:[],withdrawals:[],notifications:[],config:null};

const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(Number(v||0));
const fmtDate=v=>v?new Date(v).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}):'—';
const pill=(s)=>{let c=['confirmed','published','active','sold','qualified'].includes(String(s))?'ok':['pending','reserved','upcoming'].includes(String(s))?'warn':['rejected','cancelled','finished'].includes(String(s))?'danger':'info';return `<span class="pill ${c}">${esc(s)}</span>`};

async function authUser(){const r=await sb.auth.getUser();return r.data.user}
async function isAdmin(){
 const u=await authUser(); if(!u)return false;
 const r=await sb.from('profiles').select('is_admin,email,first_name,last_name,public_id').eq('id',u.id).maybeSingle();
 return !!(r.data&&r.data.is_admin);
}
function login(){
 app.innerHTML=`<div class="login"><div class="card loginbox">
 <div class="ey">APP SORTEOS</div><div class="h">Panel de administración</div>
 <p class="muted">Entrá con la cuenta de administrador de Supabase.</p>
 <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
 <div class="field"><label>Contraseña</label><input id="pass" type="password" autocomplete="current-password"></div>
 <button class="btn primary" style="width:100%" onclick="doLogin()">ENTRAR</button>
 <p id="err" class="muted" style="font-size:12px;margin-top:10px"></p>
 </div></div>`;
}
async function doLogin(){
 const emailEl=document.getElementById('email'), passEl=document.getElementById('pass'), errEl=document.getElementById('err');
 const e=emailEl.value.trim(),p=passEl.value;if(!e||!p)return errEl.textContent='Completá email y contraseña.';
 const r=await sb.auth.signInWithPassword({email:e,password:p});
 if(r.error)return errEl.textContent=r.error.message;
 if(!(await isAdmin())){await sb.auth.signOut();return errEl.textContent='La cuenta entra en Supabase, pero no tiene permisos de administrador.'}
 await load();render();
}
async function logout(){await sb.auth.signOut();login()}
async function load(){
 const queries={
  raffles:sb.from('raffles').select('*').order('created_at',{ascending:false}),
  numbers:sb.from('raffle_numbers').select('*').order('updated_at',{ascending:false}),
  purchases:sb.from('purchases').select('*').order('created_at',{ascending:false}),
  profiles:sb.from('profiles').select('*').order('created_at',{ascending:false}),
  results:sb.from('results').select('*').order('created_at',{ascending:false}),
  referrals:sb.from('referrals').select('*').order('created_at',{ascending:false}),
  ledger:sb.from('points_ledger').select('*').order('created_at',{ascending:false}),
  withdrawals:sb.from('withdrawal_requests').select('*').order('created_at',{ascending:false}),
  notifications:sb.from('notifications').select('*').order('created_at',{ascending:false})
 };
 const entries=Object.entries(queries); const qs=await Promise.all(entries.map(([,q])=>q));
 D={...D}; entries.forEach(([key],i)=>{if(qs[i].error) console.warn('Error cargando '+key,qs[i].error); D[key]=qs[i].data||[]});
 const c=await sb.from('app_config').select('*').eq('id',true).maybeSingle();
 if(c.error) console.warn('Error cargando configuración',c.error); D.config=c.data||{};
}
function render(){
 app.innerHTML=`<div class="wrap">
 <header class="top"><div><div class="brand">APP <b>SORTEOS</b></div><div class="sub">Administración · ${esc(D.config?.app_name||'App Sorteos')}</div></div><button class="btn light" onclick="logout()">SALIR</button></header>
 <nav class="tabs">${[['dashboard','Resumen'],['raffles','Sorteos'],['numbers','Números'],['purchases','Pagos'],['users','Usuarios'],['referrals','Referidos'],['points','Puntos'],['withdrawals','Retiros'],['results','Resultados'],['notifications','Avisos'],['settings','Configuración']].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}</nav>
 ${window['page_'+tab]()}</div>`;
}
function page_dashboard(){
 const active=D.raffles.find(x=>x.status==='active'),pending=D.purchases.filter(x=>x.status==='pending').length,sold=D.numbers.filter(x=>x.status==='sold').length;
 return `<div class="grid">
 <div class="card"><div class="ey">Sorteos</div><div class="metric">${D.raffles.length}</div></div>
 <div class="card"><div class="ey">Activo</div><div class="metric">${active?'Sí':'No'}</div></div>
 <div class="card"><div class="ey">Pagos pendientes</div><div class="metric">${pending}</div></div>
 <div class="card"><div class="ey">Números vendidos</div><div class="metric">${sold}</div></div></div>
 <div class="grid2"><div class="card"><div class="ey">SORTEO ACTIVO</div><div class="h">${esc(active?.name||'No hay sorteo activo')}</div><p class="muted">${esc(active?.description||'Creá uno desde Sorteos.')}</p>${active?`<div>${money(active.price)} por número · cierre ${fmtDate(active.close_at)}</div>`:''}</div>
 <div class="card"><div class="ey">PENDIENTES</div><div class="h">${pending} pagos para revisar</div><button class="btn primary" onclick="tab='purchases';render()">VER PAGOS</button></div></div>`;
}
function page_raffles(){
 return `<div class="grid2"><div class="card"><div class="ey">CREAR SORTEO</div>
 <div class="field"><label>Nombre</label><input id="rn"></div><div class="field"><label>Premio</label><input id="rp"></div>
 <div class="field"><label>Descripción</label><textarea id="rd"></textarea></div><div class="field"><label>Cantidad de números</label><input id="rnumberCount" type="number" min="1" max="100" step="1" value="100"><small class="muted">Elegí cuántos números tendrá este sorteo. Siempre comienza en 00 y continúa hasta el número anterior a la cantidad. Ej.: 30 = 00–29.</small></div><div class="field"><label>Precio por número</label><input id="rprice" type="number" step=".01"><small class="muted">Precio base si no hay una promoción configurada.</small></div><div class="field"><label>Comisión de referidos (%)</label><input id="rcommission" type="number" min="0" max="100" step=".01" value="0"><small class="muted">Se aplica sobre el valor base de cada número vendido y se acredita solo al confirmar la compra.</small></div><div class="field"><label>Precios por cantidad</label><div id="priceOptionsEditor"></div><button type="button" class="btn light" onclick="addPriceOptionRow()">+ AGREGAR CANTIDAD</button><small class="muted">Configurá únicamente los paquetes de 1, 2 y 3 números. Para más números, el sistema combina automáticamente esos paquetes buscando el precio más barato.</small></div>
 <div class="field"><label>Cierre</label><input id="rc" type="datetime-local"></div><div class="field"><label>Prefijo</label><input id="rpre" value="SORTEO"></div>
 <div class="field"><label>Imagen del sorteo</label><input id="raffleImage" type="file" accept="image/*" onchange="previewRaffleImage(event)"><small class="muted">Desde el celular se abre tu galería. Máximo 5 MB · JPG, PNG, WEBP o GIF.</small><div id="raffleImagePreview" style="margin-top:8px"></div></div>
 <button class="btn primary" onclick="createRaffle()">CREAR SORTEO</button></div>
 <div class="card"><div class="ey">CONFIGURACIÓN ACTUAL</div><div>Mercado Pago: ${D.config?.mercadopago_enabled?'Habilitado':'Deshabilitado'}</div><div>Transferencia: ${D.config?.transfer_enabled?'Habilitada':'Deshabilitada'}</div><div>Moneda: ${esc(D.config?.currency||'ARS')}</div><div class="muted" style="margin-top:8px">La comisión de referidos se configura en cada sorteo.</div></div></div>
 <div class="card"><div class="ey">TODOS LOS SORTEOS</div><table class="table"><tr><th>Nombre</th><th>Números</th><th>Precio</th><th>Comisión</th><th>Cierre</th><th>Estado</th><th>Acciones</th></tr>${D.raffles.map(r=>`<tr><td><b>${esc(r.name)}</b><br><span class="muted">${esc(r.prize)}</span></td><td>${Number(r.number_count||100)} · 00–${String(Number(r.number_count||100)-1).padStart(2,'0')}</td><td>${money(r.price)}</td><td>${Number(r.referral_commission_percent||0)}%</td><td>${fmtDate(r.close_at)}</td><td>${pill(r.status)}</td><td><div class="actions">${r.status==='upcoming'?`<button class="btn primary" onclick="setRaffle('${r.id}','active')">ACTIVAR</button>`:''}${r.status==='active'?`<button class="btn light" onclick="setRaffle('${r.id}','finished')">FINALIZAR</button>`:''}${r.status!=='cancelled'&&r.status!=='finished'?`<button class="btn danger" onclick="setRaffle('${r.id}','cancelled')">CANCELAR</button>`:''}<button class="btn light" onclick="editRaffle('${r.id}')">EDITAR</button></div></td></tr>`).join('')}</table></div>`;
}
function priceOptionRow(quantity='',price=''){return `<div class="price-option-row" style="display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin-top:7px"><input class="po-qty" type="number" min="1" step="1" placeholder="Cantidad" value="${quantity}"><input class="po-price" type="number" min="0" step=".01" placeholder="Precio total" value="${price}"><button type="button" class="btn danger" onclick="this.parentElement.remove()">×</button></div>`;}
function addPriceOptionRow(){const box=document.getElementById('priceOptionsEditor');if(box)box.insertAdjacentHTML('beforeend',priceOptionRow());}
function readPriceOptions(){const rows=[...document.querySelectorAll('#priceOptionsEditor .price-option-row')];const out=[];const seen=new Set();for(const row of rows){const quantity=Number(row.querySelector('.po-qty')?.value||0),price=Number(row.querySelector('.po-price')?.value||0);if(!quantity&&!price)continue;if(!Number.isInteger(quantity)||!([1,2,3].includes(quantity))||!Number.isFinite(price)||price<=0)return alert('Revisá las promociones por cantidad. Cantidad y precio deben ser válidos.'),null;if(seen.has(quantity))return alert('No podés repetir la misma cantidad de números.'),null;seen.add(quantity);out.push({quantity,price});}return out.sort((a,b)=>a.quantity-b.quantity);}

function previewRaffleImage(e){
 const file=e.target.files?.[0], box=document.getElementById('raffleImagePreview');
 if(!box)return;
 if(!file){box.innerHTML='';return;}
 if(!file.type.startsWith('image/')){e.target.value='';box.innerHTML='';return alert('Elegí una imagen.');}
 if(file.size>5*1024*1024){e.target.value='';box.innerHTML='';return alert('La imagen supera el máximo de 5 MB.');}
 const url=URL.createObjectURL(file);
 box.innerHTML=`<img src="${url}" alt="Vista previa" style="display:block;width:100%;max-height:180px;object-fit:cover;border-radius:12px;border:1px solid var(--line)">`;
}
async function uploadRaffleImage(file,raffleId){
 if(!file)return null;
 if(!file.type.startsWith('image/')||file.size>5*1024*1024)throw new Error('Imagen inválida o mayor a 5 MB.');
 const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
 const path=`${raffleId}/${crypto.randomUUID()}.${ext}`;
 const up=await sb.storage.from('raffle-images').upload(path,file,{contentType:file.type,upsert:false});
 if(up.error)throw up.error;
 const pub=sb.storage.from('raffle-images').getPublicUrl(path);
 return pub.data.publicUrl;
}
async function createRaffle(){
 const nameEl=document.getElementById('rn'), prizeEl=document.getElementById('rp'), descEl=document.getElementById('rd'), numberCountEl=document.getElementById('rnumberCount'), priceEl=document.getElementById('rprice'), commissionEl=document.getElementById('rcommission'), closeEl=document.getElementById('rc'), prefixEl=document.getElementById('rpre'), imageEl=document.getElementById('raffleImage');
 const name=nameEl.value.trim(), prize=prizeEl.value.trim(), description=descEl.value.trim(), numberCount=Number(numberCountEl?.value||100), price=Number(priceEl.value||0), commission=Number(commissionEl?.value||0), file=imageEl.files?.[0]||null;
 const priceOptions=readPriceOptions();
 if(!name)return alert('Ingresá el nombre del sorteo.');
 if(!prize)return alert('Ingresá el premio.');
 if(!Number.isInteger(numberCount)||numberCount<1||numberCount>100)return alert('La cantidad de números debe estar entre 1 y 100.');
 if(!Number.isFinite(price)||price<=0)return alert('Ingresá un precio válido mayor que 0.');
 if(!Number.isFinite(commission)||commission<0||commission>100)return alert('La comisión debe estar entre 0% y 100%.');
 if(priceOptions===null)return;
 const q=await sb.from('raffles').insert({name,prize,description,number_count:numberCount,price,price_options:priceOptions,referral_commission_percent:commission,close_at:closeEl.value?new Date(closeEl.value).toISOString():null,prefix:prefixEl.value.trim()||'SORTEO',status:'upcoming'}).select().single();
 if(q.error)return alert(q.error.message);
 let imageError=null;
 if(file){
   try{const imageUrl=await uploadRaffleImage(file,q.data.id);const u=await sb.from('raffles').update({image_url:imageUrl,updated_at:new Date().toISOString()}).eq('id',q.data.id);if(u.error)throw u.error;}catch(e){imageError=e;}
 }
 await load();render();
 if(imageError)alert('El sorteo se creó, pero no se pudo subir la imagen: '+imageError.message);
}
async function setRaffle(id,status){const r=D.raffles.find(x=>x.id===id);if(!r)return;if(status==='active'&&r.close_at&&new Date(r.close_at).getTime()<=Date.now())return alert('No se puede activar un sorteo cuya fecha de cierre ya pasó. Editá el cierre antes de activarlo.');const labels={active:'activar',finished:'finalizar',cancelled:'cancelar'};if(!confirm('¿Seguro que querés '+(labels[status]||'cambiar')+' este sorteo?'))return;const q=await sb.from('raffles').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(q.error)return alert(q.error.message);await load();render()}
async function editRaffle(id){
 const r=D.raffles.find(x=>x.id===id);if(!r)return;
 const name=prompt('Nombre',r.name);if(name===null)return;
 const prize=prompt('Premio',r.prize);if(prize===null)return;
 const description=prompt('Descripción',r.description||'');if(description===null)return;
 const price=prompt('Precio por número',r.price);if(price===null)return;
 const commission=prompt('Comisión de referidos (%)',r.referral_commission_percent ?? 0);if(commission===null)return;
 const closeRaw=prompt('Cierre (ISO o vacío para sin fecha)',r.close_at||'');if(closeRaw===null)return;
 const prefix=prompt('Prefijo',r.prefix||'SORTEO');if(prefix===null)return;
 const commissionNum=Number(commission);if(!Number.isFinite(commissionNum)||commissionNum<0||commissionNum>100)return alert('Comisión inválida. Usá un valor entre 0 y 100.');
 const priceNum=Number(price);if(!Number.isFinite(priceNum)||priceNum<=0)return alert('Precio inválido.');
 let closeAt=null;if(closeRaw.trim()){const d=new Date(closeRaw.trim());if(Number.isNaN(d.getTime()))return alert('Fecha de cierre inválida.');closeAt=d.toISOString();}
 const rawOptions=prompt('Precios por paquete (ej: 1=10,2=18,3=24). Dejá vacío para usar precio base.',(r.price_options||[]).map(o=>o.quantity+'='+o.price).join(','));if(rawOptions===null)return;
 let priceOptions=[];if(rawOptions.trim()){try{const seen=new Set();priceOptions=rawOptions.split(',').map(x=>{const [q,p]=x.split('=');const quantity=Number(q),amount=Number(p);if(!Number.isInteger(quantity)||!([1,2,3].includes(quantity))||!Number.isFinite(amount)||amount<=0||seen.has(quantity))throw new Error();seen.add(quantity);return {quantity,price:amount};}).sort((a,b)=>a.quantity-b.quantity);}catch(e){return alert('Formato inválido. Usá únicamente 1=10,2=18,3=24');}}
 const q=await sb.from('raffles').update({name:name.trim(),prize:prize.trim(),description:description.trim(),price:priceNum,price_options:priceOptions,referral_commission_percent:commissionNum,close_at:closeAt,prefix:prefix.trim()||'SORTEO',updated_at:new Date().toISOString()}).eq('id',id);
 if(q.error)return alert(q.error.message);
 const replaceImage=confirm('¿Querés cambiar también la imagen del sorteo?');
 if(replaceImage){
   const input=document.createElement('input');input.type='file';input.accept='image/*';
   input.onchange=async()=>{const file=input.files?.[0];if(!file)return;try{const imageUrl=await uploadRaffleImage(file,id);const u=await sb.from('raffles').update({image_url:imageUrl,updated_at:new Date().toISOString()}).eq('id',id);if(u.error)throw u.error;await load();render();}catch(e){alert('No se pudo subir la imagen: '+e.message);await load();render();}};
   input.click();
 }else{await load();render();}
}
function page_numbers(){
 if(!D.raffles.length)return `<div class="card"><div class="h">No hay sorteos</div></div>`;
 const a=D.raffles.find(x=>x.id===window.selectedRaffleForNumbers)||D.raffles.find(x=>x.status==='active')||D.raffles[0];
 window.selectedRaffleForNumbers=a.id;
 const ns=D.numbers.filter(n=>n.raffle_id===a.id);const by=new Map(ns.map(n=>[Number(n.number),n]));
 return `<div class="card"><div class="ey">NÚMEROS DEL SORTEO</div><div class="field"><label>Sorteo</label><select onchange="window.selectedRaffleForNumbers=this.value;render()">${D.raffles.map(r=>`<option value="${r.id}" ${r.id===a.id?'selected':''}>${esc(r.name)} · ${esc(r.status)}</option>`).join('')}</select></div><p class="muted">${a.number_count} números · 00–${String(a.number_count-1).padStart(2,'0')}.</p><div class="numbers">${Array.from({length:Number(a.number_count||100)},(_,i)=>{const n=by.get(i)||{status:'available'};return `<button class="num ${n.status}" title="${esc(n.status)}" onclick="numberInfo('${a.id}',${i})">${String(i).padStart(2,'0')}</button>`}).join('')}</div></div>`;
}
function numberInfo(rid,n){const x=D.numbers.find(v=>v.raffle_id===rid&&Number(v.number)===n);alert(`Número ${String(n).padStart(2,'0')}\\nEstado: ${x?.status||'available'}\\nCompra: ${x?.purchase_id||'—'}\\nVence: ${fmtDate(x?.reservation_expires_at)}`)}
function page_purchases(){
 return `<div class="card"><div class="ey">PAGOS Y PARTICIPACIONES</div><p class="muted">Solo una compra confirmada debe dejar los números como vendidos.</p><table class="table"><tr><th>Fecha</th><th>Cliente</th><th>Sorteo</th><th>Monto</th><th>Medio</th><th>Estado</th><th>Acción</th></tr>${D.purchases.map(p=>{const u=D.profiles.find(x=>x.id===p.user_id),r=D.raffles.find(x=>x.id===p.raffle_id);return `<tr><td>${fmtDate(p.created_at)}</td><td><b>${esc((p.buyer_first_name||'')+' '+(p.buyer_last_name||''))}</b><br>${esc(p.buyer_whatsapp)}<br>${esc(p.buyer_email)}</td><td>${esc(r?.name||'—')}</td><td>${money(p.amount)}</td><td>${esc(p.payment_method)}</td><td>${pill(p.status)}<br><span class="muted">${esc(p.payment_status||'')}</span>${p.payment_method==='transfer'?'<br><span class="muted">Comprobante por WhatsApp</span>':''}</td><td>${p.status==='pending'?`<div class="actions"><button class="btn ok" onclick="confirmPurchase('${p.id}')">CONFIRMAR</button><button class="btn danger" onclick="rejectPurchase('${p.id}')">RECHAZAR</button></div>`:''}</td></tr>`}).join('')}</table></div>`;
}
async function setPurchaseStatus(id,status){const label=status==='confirmed'?'confirmar este pago':'rechazar esta compra';if(!confirm('¿Seguro que querés '+label+'?'))return;const q=await sb.rpc('admin_set_purchase_status',{p_purchase_id:id,p_status:status});if(q.error)return alert(q.error.message);await load();render()}
async function confirmPurchase(id){return setPurchaseStatus(id,'confirmed')}
async function rejectPurchase(id){return setPurchaseStatus(id,'rejected')}
function page_users(){
 return `<div class="card"><div class="ey">USUARIOS</div><table class="table"><tr><th>Usuario</th><th>ID público</th><th>WhatsApp</th><th>Puntos</th><th>Referido</th><th>Admin</th></tr>${D.profiles.map(p=>`<tr><td><b>${esc((p.first_name+' '+p.last_name).trim()||'Sin nombre')}</b><br>${esc(p.email)}</td><td>${esc(p.public_id)}</td><td>${esc(p.whatsapp)}</td><td>${p.points}</td><td>${esc(p.referral_code)}</td><td>${p.is_admin?'<span class="pill ok">SÍ</span>':'No'}</td></tr>`).join('')}</table></div>`;
}
function page_referrals(){
 return `<div class="card"><div class="ey">REFERIDOS</div><p class="muted">La comisión se genera por cada compra confirmada del referido. Los puntos mostrados son el acumulado acreditado a ese indicador.</p><table class="table"><tr><th>Fecha</th><th>Quién indica</th><th>Referido</th><th>Compras confirmadas</th><th>Estado</th><th>Puntos acumulados</th></tr>${D.referrals.map(r=>{const a=D.profiles.find(x=>x.id===r.referrer_id),b=D.profiles.find(x=>x.id===r.referred_id);const purchases=D.purchases.filter(p=>p.user_id===r.referred_id&&['confirmed','finished'].includes(String(p.status).toLowerCase())).length;return `<tr><td>${fmtDate(r.created_at)}</td><td>${esc(a?.first_name+' '+a?.last_name)}<br>${esc(a?.referral_code)}</td><td>${esc(b?.first_name+' '+b?.last_name)}<br>${esc(b?.email)}</td><td>${purchases}</td><td>${pill(r.status)}</td><td>${Number(r.points_awarded||0)} pts</td></tr>`}).join('')||'<tr><td colspan="6" class="muted">Todavía no hay referidos registrados.</td></tr>'}</table></div>`;
}
function page_points(){
 return `<div class="grid2"><div class="card"><div class="ey">LEDGER DE PUNTOS</div><table class="table"><tr><th>Fecha</th><th>Usuario</th><th>Cantidad</th><th>Tipo</th><th>Motivo</th></tr>${D.ledger.map(x=>{const u=D.profiles.find(p=>p.id===x.user_id);return `<tr><td>${fmtDate(x.created_at)}</td><td>${esc(u?.email)}</td><td>${x.amount}</td><td>${pill(x.type)}</td><td>${esc(x.reason)}</td></tr>`}).join('')}</table></div><div class="card"><div class="ey">AJUSTE MANUAL</div><p class="muted">Agregar un movimiento y actualizar el saldo del usuario.</p><div class="field"><label>Usuario</label><select id="pu">${D.profiles.map(p=>`<option value="${p.id}">${esc((p.first_name+' '+p.last_name).trim()||p.email)} · ${p.points} pts</option>`).join('')}</select></div><div class="field"><label>Cantidad (+/-)</label><input id="pa" type="number"></div><div class="field"><label>Motivo</label><input id="pr" value="Ajuste administrativo"></div><button class="btn primary" onclick="adjustPoints()">APLICAR</button></div></div>`;
}
async function adjustPoints(){const uid=pu.value,amount=Number(pa.value||0);if(!Number.isInteger(amount)||!amount)return alert('Ingresá una cantidad entera distinta de cero.');const q=await sb.rpc('admin_adjust_points',{p_user_id:uid,p_amount:amount,p_reason:pr.value.trim()||'Ajuste administrativo'});if(q.error)return alert(q.error.message);await load();render()}
function page_withdrawals(){
 const pending=D.withdrawals.filter(x=>x.status==='pending').length;
 return `<div class="card"><div class="ey">RETIROS DE PUNTOS</div><p class="notice">1 punto = $1 ARS. No hay monto mínimo. Al solicitar un retiro, los puntos quedan retenidos hasta marcarlo como pagado o rechazado.</p><div class="h">${pending} pendientes</div><table class="table"><tr><th>Fecha</th><th>Usuario</th><th>Puntos / ARS</th><th>WhatsApp</th><th>Alias</th><th>Estado</th><th>Acción</th></tr>${D.withdrawals.map(x=>{const u=D.profiles.find(p=>p.id===x.user_id);return `<tr><td>${fmtDate(x.created_at)}</td><td><b>${esc((u?.first_name+' '+u?.last_name).trim()||u?.email)}</b><br><span class="muted">${esc(u?.public_id)}</span></td><td><b>${x.points} pts</b><br>${money(x.points)}</td><td>${esc(x.whatsapp)}</td><td><b>${esc(x.alias)}</b></td><td>${pill(x.status)}${x.admin_note?`<br><span class="muted">${esc(x.admin_note)}</span>`:''}</td><td>${x.status==='pending'?`<div class="actions"><button class="btn ok" onclick="processWithdrawal('${x.id}','paid')">MARCAR PAGADO</button><button class="btn danger" onclick="processWithdrawal('${x.id}','rejected')">RECHAZAR</button></div>`:''}</td></tr>`}).join('')||'<tr><td colspan="7" class="muted">No hay solicitudes de retiro.</td></tr>'}</table></div>`;
}
async function processWithdrawal(id,status){const note=status==='rejected'?prompt('Motivo del rechazo (opcional):',''):null;if(status==='rejected'&&note===null)return;const q=await sb.rpc('admin_process_withdrawal',{p_withdrawal_id:id,p_status:status,p_note:note||null});if(q.error)return alert(q.error.message);await load();render()}
function page_results(){
 const rows=D.raffles.map(r=>{const x=D.results.find(z=>z.raffle_id===r.id);return `<tr><td>${esc(r.name)}</td><td>${esc(x?.official_result||r.official_result||'—')}</td><td>${x?.published?'<span class="pill ok">INDEX DETERMINA</span>':'—'}</td><td>${x?.published?'<span class="pill ok">PUBLICADO</span>':'<span class="pill warn">PENDIENTE</span>'}</td><td><button class="btn primary" onclick="publishResult('${r.id}')">CARGAR / PUBLICAR</button></td></tr>`}).join('');
 return `<div class="card"><div class="ey">RESULTADOS</div><p class="notice">Cargá los datos oficiales de la Lotería Nacional. El índice público determina automáticamente el primer número válido según la cantidad habilitada del sorteo.</p><table class="table"><tr><th>Sorteo</th><th>Resultado Lotería Nacional</th><th>Ganador</th><th>Estado</th><th></th></tr>${rows}</table></div>`;
}
async function publishResult(id){const text=prompt('Resultado oficial:','');if(text===null)return;if(!text.trim())return alert('Ingresá el resultado oficial.');const q=await sb.rpc('admin_publish_result',{p_raffle_id:id,p_official_result:text.trim(),p_winning_number:null});if(q.error)return alert(q.error.message);await load();render()}
function page_notifications(){
 return `<div class="grid2"><div class="card"><div class="ey">ENVIAR AVISO</div><div class="field"><label>Usuario</label><select id="nu"><option value="">Todos</option>${D.profiles.map(p=>`<option value="${p.id}">${esc(p.email)}</option>`).join('')}</select></div><div class="field"><label>Título</label><input id="nt"></div><div class="field"><label>Mensaje</label><textarea id="nm"></textarea></div><div class="field"><label>Tipo</label><select id="ny"><option>info</option><option>success</option><option>warning</option><option>danger</option></select></div><button class="btn primary" onclick="sendNotice()">ENVIAR</button></div><div class="card"><div class="ey">AVISOS RECIENTES</div><table class="table"><tr><th>Fecha</th><th>Usuario</th><th>Título</th><th>Tipo</th></tr>${D.notifications.slice(0,50).map(n=>{const u=D.profiles.find(p=>p.id===n.user_id);return `<tr><td>${fmtDate(n.created_at)}</td><td>${esc(u?.email)}</td><td>${esc(n.title)}</td><td>${pill(n.type)}</td></tr>`}).join('')}</table></div></div>`;
}
async function sendNotice(){const users=nu.value?[nu.value]:D.profiles.map(p=>p.id);if(!nt.value.trim()||!nm.value.trim())return alert('Completá título y mensaje.');const rows=users.map(id=>({user_id:id,title:nt.value.trim(),message:nm.value.trim(),type:ny.value}));const q=await sb.from('notifications').insert(rows);if(q.error)return alert(q.error.message);await load();render();alert('Aviso enviado.')}
function page_settings(){
 const c=D.config||{};return `<div class="card"><div class="ey">CONFIGURACIÓN GENERAL</div><div class="field"><label>Nombre de la app</label><input id="ca" value="${esc(c.app_name)}"></div><div class="field"><label>Moneda</label><input id="cc" value="${esc(c.currency)}"></div><div class="field"><label>Mercado Pago habilitado</label><select id="cm"><option value="true" ${c.mercadopago_enabled?'selected':''}>Sí</option><option value="false" ${!c.mercadopago_enabled?'selected':''}>No</option></select></div><div class="field"><label>Transferencia habilitada</label><select id="ct"><option value="true" ${c.transfer_enabled?'selected':''}>Sí</option><option value="false" ${!c.transfer_enabled?'selected':''}>No</option></select></div><div class="field"><label>Instrucciones de transferencia</label><textarea id="ci">${esc(c.transfer_instructions||'')}</textarea></div><div class="notice">Los puntos por referido dejaron de ser fijos. La comisión se configura como porcentaje en cada sorteo.</div><button class="btn primary" onclick="saveConfig()">GUARDAR CONFIGURACIÓN</button></div>`;
}
async function saveConfig(){const q=await sb.from('app_config').update({app_name:ca.value.trim(),currency:cc.value.trim(),mercadopago_enabled:cm.value==='true',transfer_enabled:ct.value==='true',transfer_instructions:ci.value.trim(),updated_at:new Date().toISOString()}).eq('id',true);if(q.error)return alert(q.error.message);await load();render();alert('Configuración guardada.')}
(async()=>{const u=await authUser();if(!u||!(await isAdmin()))return login();await load();render()})();
</script></body></html>
